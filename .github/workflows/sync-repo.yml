name: Sync Repo 1 to Repo 2

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout Repo 1
      - name: Checkout Repo 1
        uses: actions/checkout@v3

      # Step 2 — Set up Git user
      - name: Setup Git
        run: |
          git config --global user.name "Nassaritos"
          git config --global user.email "ibraheem.a.nassar@gmail.com"

      # Step 3 — Clone Repo 2
      - name: Clone Repo 2
        run: git clone https://github.com/Nassaritos/karima_nadeem_wedding.git repo2

      # Step 4 — Copy files from Repo 1 into Repo 2
      - name: Copy changes to Repo 2
        run: |
          rsync -av --delete ./ repo2/   # copy everything into repo2

      # Step 5 — Commit + Push to Repo 2
      - name: Push changes to Repo 2
        run: |
          cd repo2
          git add .
          git commit -m "🔄 Sync update from Repo 1"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
